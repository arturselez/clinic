name = "clinic-contact-form"
main = "src/index.ts"
compatibility_date = "2024-01-01"

[dev]
port = 8787

# Задайте секреты через: wrangler secret put RESEND_API_KEY
# Остальное — в [vars] ниже или через wrangler secret

[vars]
CONTACT_TO_EMAIL = "your-clinic@example.com"
CONTACT_FROM_EMAIL = "onboarding@resend.dev"
ALLOWED_ORIGINS = "http://localhost:5173,https://YOUR-GITHUB-USERNAME.github.io"
